<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | MindEase</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/base.css">
  <link rel="stylesheet" href="styles/reset-password.css">
</head>
<body class="reset-page">
  <div class="ambient-shape one"></div>
  <div class="ambient-shape two"></div>

  <header class="topbar">
    <div class="brand-wrap">
      <img src="logo.jpg" alt="MindEase logo" class="brand-logo">
      <div class="brand-text">MindEase V3</div>
    </div>
    <nav class="top-nav">
      <a href="features.html">Features</a>
      <a href="about.html">About MindEase</a>
    </nav>
    <div class="header-right">
      <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme">🌙</button>
      <a id="headerAuthLink" href="auth.html?redirect=dashboard" class="ghost-btn">Sign In</a>
    </div>
  </header>

  <main class="reset-shell">
    <section class="reset-card reveal">
      <h1>Reset Your Password</h1>
      <p>Enter a new password for your MindEase account.</p>
      <form id="resetForm" class="stack-form">
        <label>
          New Password
          <input id="newPassword" type="password" minlength="8" required placeholder="Minimum 8 characters">
        </label>
        <label>
          Confirm Password
          <input id="confirmPassword" type="password" minlength="8" required placeholder="Re-enter your new password">
        </label>
        <button type="submit" class="primary-btn">Update Password</button>
      </form>
      <p id="resetMessage" class="form-message"></p>
      <a href="auth.html?redirect=dashboard" class="ghost-btn reset-back-btn">Back to Sign In</a>
    </section>
  </main>

  <footer class="site-footer">Copyright 2026 MindEase. All rights reserved.</footer>

  <script src="theme.js"></script>
  <script src="common.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
